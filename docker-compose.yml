services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:?POSTGRES_OWNER_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?POSTGRES_OWNER_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vennek-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: "${VENNEK_IMAGE:?VENNEK_IMAGE is required}:${VENNEK_IMAGE_TAG:?VENNEK_IMAGE_TAG is required}"
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_OWNER_URL: ${DATABASE_OWNER_URL:?DATABASE_OWNER_URL is required}
    command: ["npm", "run", "migrate:agent"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  provision-app-role:
    image: "${VENNEK_IMAGE:?VENNEK_IMAGE is required}:${VENNEK_IMAGE_TAG:?VENNEK_IMAGE_TAG is required}"
    environment:
      DATABASE_OWNER_URL: ${DATABASE_OWNER_URL:?DATABASE_OWNER_URL is required}
      VENNEK_APP_DB_USER: ${VENNEK_APP_DB_USER:?VENNEK_APP_DB_USER is required}
      VENNEK_APP_DB_PASSWORD: ${VENNEK_APP_DB_PASSWORD:?VENNEK_APP_DB_PASSWORD is required}
    command: ["npm", "run", "provision:app-role"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  provision-knowledge-role:
    image: "${VENNEK_IMAGE:?VENNEK_IMAGE is required}:${VENNEK_IMAGE_TAG:?VENNEK_IMAGE_TAG is required}"
    environment:
      DATABASE_OWNER_URL: ${DATABASE_OWNER_URL:?DATABASE_OWNER_URL is required}
      VENNEK_KNOWLEDGE_DB_USER: ${VENNEK_KNOWLEDGE_DB_USER:?VENNEK_KNOWLEDGE_DB_USER is required}
      VENNEK_KNOWLEDGE_DB_PASSWORD: ${VENNEK_KNOWLEDGE_DB_PASSWORD:?VENNEK_KNOWLEDGE_DB_PASSWORD is required}
    command: ["npm", "run", "provision:knowledge-role"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  litellm:
    image: ghcr.io/berriai/litellm:v1.98.0@sha256:20b5044b619055374061a6d5b7b08754cad75aeabbf82ddf4f69cc0cf80ddaf4
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      PRIVATE_OPENAI_API_KEY: ${PRIVATE_OPENAI_API_KEY:?PRIVATE_OPENAI_API_KEY is required}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:?OPENAI_EMBEDDING_MODEL is required}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      OPENAI_FAST_MODEL: ${OPENAI_FAST_MODEL:?OPENAI_FAST_MODEL is required}
      OPENAI_QUALITY_MODEL: ${OPENAI_QUALITY_MODEL:?OPENAI_QUALITY_MODEL is required}
      OPENAI_VERIFIER_MODEL: ${OPENAI_VERIFIER_MODEL:?OPENAI_VERIFIER_MODEL is required}
      ANTHROPIC_FAST_MODEL: ${ANTHROPIC_FAST_MODEL:?ANTHROPIC_FAST_MODEL is required}
      ANTHROPIC_QUALITY_MODEL: ${ANTHROPIC_QUALITY_MODEL:?ANTHROPIC_QUALITY_MODEL is required}
      ANTHROPIC_VERIFIER_MODEL: ${ANTHROPIC_VERIFIER_MODEL:?ANTHROPIC_VERIFIER_MODEL is required}
      GEMINI_FAST_MODEL: ${GEMINI_FAST_MODEL:?GEMINI_FAST_MODEL is required}
      GEMINI_QUALITY_MODEL: ${GEMINI_QUALITY_MODEL:?GEMINI_QUALITY_MODEL is required}
      GEMINI_VERIFIER_MODEL: ${GEMINI_VERIFIER_MODEL:?GEMINI_VERIFIER_MODEL is required}
      PRIVATE_OPENAI_QUALITY_MODEL: ${PRIVATE_OPENAI_QUALITY_MODEL:?PRIVATE_OPENAI_QUALITY_MODEL is required}
      PRIVATE_OPENAI_VERIFIER_MODEL: ${PRIVATE_OPENAI_VERIFIER_MODEL:?PRIVATE_OPENAI_VERIFIER_MODEL is required}
    volumes:
      - ./config/litellm.example.yaml:/app/config.yaml:ro
    expose:
      - "4000"

  telegram-webhook:
    image: "${VENNEK_IMAGE:?VENNEK_IMAGE is required}:${VENNEK_IMAGE_TAG:?VENNEK_IMAGE_TAG is required}"
    environment:
      DATABASE_URL: ${DATABASE_APP_URL:?DATABASE_APP_URL is required}
      VENNEK_ENCRYPTION_KEY: ${VENNEK_ENCRYPTION_KEY:?VENNEK_ENCRYPTION_KEY is required}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?TELEGRAM_WEBHOOK_SECRET is required}
      PORT: "8080"
    command: ["node", "apps/telegram-bot/dist/main.js", "--webhook"]
    ports:
      - "127.0.0.1:${WEBHOOK_PORT:-8080}:8080"
    depends_on:
      provision-app-role:
        condition: service_completed_successfully
      litellm:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/telegram/webhook').then((r) => process.exit(r.status === 401 ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  agent-worker:
    image: "${VENNEK_IMAGE:?VENNEK_IMAGE is required}:${VENNEK_IMAGE_TAG:?VENNEK_IMAGE_TAG is required}"
    environment:
      DATABASE_URL: ${DATABASE_APP_URL:?DATABASE_APP_URL is required}
      VENNEK_ENCRYPTION_KEY: ${VENNEK_ENCRYPTION_KEY:?VENNEK_ENCRYPTION_KEY is required}
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_API_KEY:?LITELLM_API_KEY is required}
      VENNEK_MODEL_FAST: ${VENNEK_MODEL_FAST:?VENNEK_MODEL_FAST is required}
      VENNEK_MODEL_QUALITY: ${VENNEK_MODEL_QUALITY:?VENNEK_MODEL_QUALITY is required}
      VENNEK_MODEL_VERIFIER: ${VENNEK_MODEL_VERIFIER:?VENNEK_MODEL_VERIFIER is required}
      VENNEK_EMBEDDING_MODEL: ${VENNEK_EMBEDDING_MODEL:?VENNEK_EMBEDDING_MODEL is required}
      KNOWLEDGE_PROMOTION_URL: ${KNOWLEDGE_PROMOTION_URL:?KNOWLEDGE_PROMOTION_URL is required}
      KNOWLEDGE_PROMOTION_KEY_ID: ${KNOWLEDGE_PROMOTION_KEY_ID:?KNOWLEDGE_PROMOTION_KEY_ID is required}
      KNOWLEDGE_PROMOTION_KEY: ${KNOWLEDGE_PROMOTION_KEY:?KNOWLEDGE_PROMOTION_KEY is required}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      PRIVATE_DOCUMENT_EXTRACTOR_URL: http://private-document-extractor:8083
      PRIVATE_DOCUMENT_EXTRACTOR_TOKEN: ${PRIVATE_DOCUMENT_EXTRACTOR_TOKEN:?PRIVATE_DOCUMENT_EXTRACTOR_TOKEN is required}
      VENNEK_PRIVATE_MODEL_QUALITY: ${VENNEK_PRIVATE_MODEL_QUALITY:?VENNEK_PRIVATE_MODEL_QUALITY is required}
      VENNEK_PRIVATE_MODEL_VERIFIER: ${VENNEK_PRIVATE_MODEL_VERIFIER:?VENNEK_PRIVATE_MODEL_VERIFIER is required}
    command: ["node", "apps/telegram-bot/dist/main.js", "--worker"]
    depends_on:
      provision-app-role:
        condition: service_completed_successfully
      litellm:
        condition: service_started
      private-document-extractor:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - private-document-sandbox

  knowledge-worker:
    image: "${VENNEK_IMAGE:?VENNEK_IMAGE is required}:${VENNEK_IMAGE_TAG:?VENNEK_IMAGE_TAG is required}"
    environment:
      DATABASE_KNOWLEDGE_URL: ${DATABASE_KNOWLEDGE_APP_URL:?DATABASE_KNOWLEDGE_APP_URL is required}
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_API_KEY:?LITELLM_API_KEY is required}
      VENNEK_EMBEDDING_MODEL: ${VENNEK_EMBEDDING_MODEL:?VENNEK_EMBEDDING_MODEL is required}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:?SEARXNG_BASE_URL is required}
      KNOWLEDGE_PROMOTION_PORT: ${KNOWLEDGE_PROMOTION_PORT:?KNOWLEDGE_PROMOTION_PORT is required}
      KNOWLEDGE_PROMOTION_KEY_ID: ${KNOWLEDGE_PROMOTION_KEY_ID:?KNOWLEDGE_PROMOTION_KEY_ID is required}
      KNOWLEDGE_PROMOTION_KEY: ${KNOWLEDGE_PROMOTION_KEY:?KNOWLEDGE_PROMOTION_KEY is required}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PDF_EXTRACTOR_URL: http://pdf-extractor:8081
      PDF_EXTRACTOR_TOKEN: ${PDF_EXTRACTOR_TOKEN:?PDF_EXTRACTOR_TOKEN is required}
    command: ["node", "apps/telegram-bot/dist/main.js", "--knowledge-worker"]
    expose: ["8082"]
    depends_on:
      provision-knowledge-role:
        condition: service_completed_successfully
      litellm:
        condition: service_started
      pdf-extractor:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - pdf-sandbox

  rag-evaluator:
    image: "${VENNEK_IMAGE:?VENNEK_IMAGE is required}:${VENNEK_IMAGE_TAG:?VENNEK_IMAGE_TAG is required}"
    profiles: ["evaluation"]
    environment:
      DATABASE_URL: ${DATABASE_APP_URL:?DATABASE_APP_URL is required}
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_API_KEY:?LITELLM_API_KEY is required}
      VENNEK_MODEL_FAST: ${VENNEK_MODEL_FAST:?VENNEK_MODEL_FAST is required}
      VENNEK_MODEL_QUALITY: ${VENNEK_MODEL_QUALITY:?VENNEK_MODEL_QUALITY is required}
      VENNEK_MODEL_VERIFIER: ${VENNEK_MODEL_VERIFIER:?VENNEK_MODEL_VERIFIER is required}
      VENNEK_EMBEDDING_MODEL: ${VENNEK_EMBEDDING_MODEL:?VENNEK_EMBEDDING_MODEL is required}
    command: ["npm", "run", "eval:cardano-rag:live"]
    depends_on:
      provision-app-role:
        condition: service_completed_successfully
      litellm:
        condition: service_started
    restart: "no"

  pdf-extractor:
    image: "${VENNEK_IMAGE:?VENNEK_IMAGE is required}:${VENNEK_IMAGE_TAG:?VENNEK_IMAGE_TAG is required}"
    environment:
      PDF_EXTRACTOR_TOKEN: ${PDF_EXTRACTOR_TOKEN:?PDF_EXTRACTOR_TOKEN is required}
      PDF_EXTRACTOR_PORT: "8081"
    command: ["node", "packages/cardano-agent/dist/knowledge/pdfExtractorServer.js"]
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8081/health').then((r) => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 6
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.50"
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=0700,uid=1000,gid=1000,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    init: true
    restart: unless-stopped
    networks:
      - pdf-sandbox

  private-document-extractor:
    image: "${VENNEK_IMAGE:?VENNEK_IMAGE is required}:${VENNEK_IMAGE_TAG:?VENNEK_IMAGE_TAG is required}"
    environment:
      PRIVATE_DOCUMENT_EXTRACTOR_TOKEN: ${PRIVATE_DOCUMENT_EXTRACTOR_TOKEN:?PRIVATE_DOCUMENT_EXTRACTOR_TOKEN is required}
      PRIVATE_DOCUMENT_EXTRACTOR_PORT: "8083"
    command: ["node", "packages/cardano-agent/dist/privateComparison/privateDocumentServer.js"]
    expose:
      - "8083"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8083/health').then((r) => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 6
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.50"
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=0700,uid=1000,gid=1000,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    init: true
    restart: unless-stopped
    networks:
      - private-document-sandbox

volumes:
  vennek-postgres:

networks:
  pdf-sandbox:
    internal: true
  private-document-sandbox:
    internal: true
