services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: vennek
      POSTGRES_USER: vennek
      POSTGRES_PASSWORD: vennek
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vennek -d vennek"]
      interval: 2s
      timeout: 2s
      retries: 20
